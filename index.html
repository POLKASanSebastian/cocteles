<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2a4a">
<title>POLKA · Cócteles</title>
<style>
  :root {
    --navy: #1a2a4a;
    --navy-dark: #0f1a30;
    --navy-light: #2a3d6a;
    --accent: #5fb88a;
    --accent-soft: #8fd4a8;
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #1a2a4a;
    --text-soft: #5a6478;
    --line: #e4e1d8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding-bottom: 80px; min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--navy);
    color: white;
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    font-family: 'Arial Black', sans-serif;
  }
  .brand span {
    color: var(--accent-soft);
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 1px;
    margin-left: 8px;
  }
  .count {
    font-size: 12px;
    color: var(--accent-soft);
    letter-spacing: 1px;
  }

  /* SEARCH */
  .search-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .search {
    width: 100%;
    padding: 12px 40px 12px 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: rgba(255,255,255,0.95);
    color: var(--navy);
    outline: none;
  }
  .search::placeholder { color: #8a92a5; }
  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--navy-light);
    color: white;
    border: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 16px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .search-clear.visible { display: flex; }

  /* FILTERS */
  .filters {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter {
    background: rgba(255,255,255,0.12);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter.active {
    background: var(--accent);
    color: var(--navy-dark);
    border-color: var(--accent);
    font-weight: 700;
  }

  /* LIST */
  .list {
    padding: 12px;
  }
  .group-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text-soft);
    margin: 22px 4px 10px;
    text-transform: uppercase;
  }
  .group-title:first-child { margin-top: 4px; }

  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(26,42,74,0.06);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .card:active { transform: scale(0.98); }
  .card.has-img { display: flex; gap: 14px; align-items: center; }
  .card-thumb {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: #e8e5dc;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }
  .card-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.3px;
    line-height: 1.2;
  }
  .badge {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 8px;
    border-radius: 4px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .badge-clasico { background: #e8edf5; color: var(--navy); }
  .badge-polka { background: var(--accent); color: white; }
  .badge-jarras { background: #c9803a; color: white; }
  .badge-zero { background: #2a3d6a; color: var(--accent-soft); }
  .badge-cafes { background: #6b4226; color: #f5e6d8; }
  .card-ingredients {
    font-size: 15px;
    color: var(--text-soft);
    line-height: 1.4;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-soft);
  }
  .empty-emoji { font-size: 40px; margin-bottom: 12px; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,26,48,0.6);
    z-index: 200;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    width: 100%;
    max-height: 92vh;
    border-radius: 20px 20px 0 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: #d4cfc2;
    border-radius: 2px;
    margin: 10px auto 0;
  }
  .modal-photo {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
  }
  .modal-header {
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .modal-name {
    font-size: 30px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    line-height: 1.15;
  }
  .modal-badge-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--navy);
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-body { padding: 20px 22px 40px; }

  .section {
    margin-bottom: 26px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .meta-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .meta-chip {
    background: white;
    border: 1px solid var(--line);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    flex: 1;
    min-width: 0;
  }
  .meta-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-soft);
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }
  .meta-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.3;
  }

  .ingredients-list {
    background: white;
    border-radius: 10px;
    padding: 4px 0;
    list-style: none;
  }
  .ingredients-list li {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 18px;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 12px;
    line-height: 1.3;
  }
  .ingredients-list li:last-child { border-bottom: none; }
  .ingredients-list li::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .ing-amount { font-weight: 800; color: var(--navy); font-size: 19px; }
  .ing-name { color: var(--text-soft); }

  .prep-text, .deco-text {
    background: white;
    border-radius: 10px;
    padding: 18px 20px;
    font-size: 17px;
    line-height: 1.55;
    color: var(--navy);
  }
  .deco-text { font-style: italic; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="brand">POLKA <span>Cócteles</span></div>
    <div class="count" id="count">35 recetas</div>
  </div>
  <div class="search-wrap">
    <input type="text" class="search" id="search" placeholder="Buscar cóctel o ingrediente..." autocomplete="off">
    <button class="search-clear" id="searchClear">×</button>
  </div>
  <div class="filters" id="filters">
    <button class="filter active" data-filter="todos">Todos</button>
    <button class="filter" data-filter="jarras">Jarras</button>
    <button class="filter" data-filter="polka">POLKA</button>
    <button class="filter" data-filter="clasico">Clásicos</button>
    <button class="filter" data-filter="cafes">Cafés</button>
    <button class="filter" data-filter="zero">Sin alcohol</button>
  </div>
</div>

<div class="list" id="list"></div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="mPhotoWrap"></div>
    <div class="modal-header">
      <div class="modal-name" id="mName"></div>
      <div class="modal-badge-row" id="mBadge"></div>
      <button class="modal-close" id="mClose">×</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

// === STATE ===
let activeFilter = 'todos';
let searchTerm = '';

// === RENDER ===
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const searchClearEl = document.getElementById('searchClear');

function getBadge(cat) {
  if (cat === 'jarras') return '<span class="badge badge-jarras">Jarra</span>';
  if (cat === 'polka') return '<span class="badge badge-polka">POLKA</span>';
  if (cat === 'clasico') return '<span class="badge badge-clasico">Clásico</span>';
  if (cat === 'zero') return '<span class="badge badge-zero">0.0</span>';
  if (cat === 'cafes') return '<span class="badge badge-cafes">Café</span>';
  return '';
}

function getGroupTitle(cat) {
  if (cat === 'jarras') return 'JARRAS · PARA COMPARTIR';
  if (cat === 'polka') return 'COCKTAILS POLKA';
  if (cat === 'clasico') return 'CLÁSICOS';
  if (cat === 'cafes') return 'CAFÉS';
  if (cat === 'zero') return 'SIN ALCOHOL';
  return '';
}

function render() {
  const term = searchTerm.toLowerCase().trim();
  let filtered = cocteles.filter(c => {
    if (activeFilter !== 'todos' && c.cat !== activeFilter) return false;
    if (!term) return true;
    if (c.nombre.toLowerCase().includes(term)) return true;
    return c.ingredientes.some(i => i.n.toLowerCase().includes(term));
  });

  countEl.textContent = filtered.length + (filtered.length === 1 ? ' receta' : ' recetas');

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty"><div class="empty-emoji">🍸</div><div>No hay cócteles que coincidan</div></div>';
    return;
  }

  // Group by category when "todos"
  if (activeFilter === 'todos' && !term) {
    const groups = ['jarras', 'polka', 'clasico', 'cafes', 'zero'];
    let html = '';
    groups.forEach(g => {
      const items = filtered.filter(c => c.cat === g);
      if (items.length === 0) return;
      html += `<div class="group-title">${getGroupTitle(g)}</div>`;
      items.forEach((c, i) => {
        const idx = cocteles.indexOf(c);
        html += renderCard(c, idx);
      });
    });
    listEl.innerHTML = html;
  } else {
    listEl.innerHTML = filtered.map(c => renderCard(c, cocteles.indexOf(c))).join('');
  }

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openModal(parseInt(card.dataset.idx)));
  });
}

function renderCard(c, idx) {
  const ings = c.ingredientes.slice(0, 3).map(i => i.n).join(' · ');
  const more = c.ingredientes.length > 3 ? ` · +${c.ingredientes.length - 3}` : '';
  const thumb = c.img ? `<img class="card-thumb" src="${c.img}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
  return `
    <div class="card${c.img ? ' has-img' : ''}" data-idx="${idx}">
      ${thumb}
      <div class="card-body">
        <div class="card-top">
          <div class="card-name">${c.nombre}</div>
          ${getBadge(c.cat)}
        </div>
        <div class="card-ingredients">${ings}${more}</div>
      </div>
    </div>
  `;
}

// === MODAL ===
const modal = document.getElementById('modal');
const mName = document.getElementById('mName');
const mBadge = document.getElementById('mBadge');
const mBody = document.getElementById('mBody');
const mClose = document.getElementById('mClose');

function openModal(idx) {
  const c = cocteles[idx];
  mName.textContent = c.nombre;
  mBadge.innerHTML = getBadge(c.cat);
  document.getElementById('mPhotoWrap').innerHTML = c.img
    ? `<img class="modal-photo" src="${c.img}" alt="${c.nombre}" onerror="this.remove()">`
    : '';

  let html = `
    <div class="meta-row">
      <div class="meta-chip">
        <span class="meta-label">Método</span>
        <span class="meta-value">${c.metodo}</span>
      </div>
      <div class="meta-chip">
        <span class="meta-label">Vajilla</span>
        <span class="meta-value">${c.vajilla}</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Ingredientes</div>
      <ul class="ingredients-list">
        ${c.ingredientes.map(i => `<li><span class="ing-amount">${i.a}</span><span class="ing-name">${i.n}</span></li>`).join('')}
      </ul>
    </div>

    <div class="section">
      <div class="section-title">Preparación</div>
      <div class="prep-text">${c.preparacion}</div>
    </div>

    <div class="section">
      <div class="section-title">Decoración</div>
      <div class="deco-text">${c.decoracion}</div>
    </div>
  `;

  mBody.innerHTML = html;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
}

mClose.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => {
  if (e.target === modal) closeModal();
});

// === SEARCH ===
searchEl.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  searchClearEl.classList.toggle('visible', searchTerm.length > 0);
  render();
});
searchClearEl.addEventListener('click', () => {
  searchEl.value = '';
  searchTerm = '';
  searchClearEl.classList.remove('visible');
  searchEl.focus();
  render();
});

// === FILTERS ===
document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

// Initial render
render();
</script>
